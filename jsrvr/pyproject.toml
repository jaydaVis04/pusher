[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "remem"
version = "0.1.0"
description = "Read-only Android shared-memory research control center"
requires-python = ">=3.10"
dependencies = ["textual>=1,<7", "tomli>=2; python_version < '3.11'"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.8", "mypy>=1.13"]

[project.scripts]
remem = "remem.cli:main"

[tool.setuptools.packages.find]
include = ["remem*"]

[tool.setuptools.package-data]
remem = ["*.tcss"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
