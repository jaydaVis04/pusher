[adb]
serial = ""
timeout_seconds = 30

[module]
local_path = "./kernel/re_mem_region.ko"
remote_path = "/data/local/tmp/re_mem_region.ko"
symbol = "getthisguy"
name = "re_mem_region"
# Set true ONLY after verifying the kernel ABI and building for this device.
abi_verified = false

[ui]
default_region = 2
watch_interval_ms = 250

[memory]
# bounded: dd bs=1 skip=OFFSET count=LENGTH; cat: reliable full-region fallback
read_mode = "bounded"
max_read_bytes = 67108864

[captures]
directory = "./captures"

[[candidate]]
region = 2
offset = "0xfc04"
name = "Display state (observed correlation)"
off_value = "0x40"
on_value = "0x00"

[[candidate]]
region = 2
offset = "0xa40b4"
name = "Display-related candidate A"
off_value = "0x08"
on_value = "0x88"

[[candidate]]
region = 2
offset = "0xa40b8"
name = "Display-related candidate B"
off_value = "0x08"
on_value = "0x88"
